# Uncomment these two line to add support for encoders to your firmware
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# LCD Display (ST7735R, 80x160, 4-wire SPI)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ST7735R=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y

# Uncomment the following lines to enable RGB underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_MAX17048=y


# Enable Zephyr Sleep
CONFIG_PM_DEVICE=y
# Enable Sleep
CONFIG_ZMK_SLEEP=y
# Sleep after 5 minutes of inactivity
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=90000

# Keep DCDC disabled during bring-up. Re-enable only after confirming the
# required external DCDC inductors/capacitors are present and correctly wired.
CONFIG_BOARD_ENABLE_DCDC=n
CONFIG_BOARD_ENABLE_DCDC_HV=n

# Enables led support
CONFIG_PWM=y
# CONFIG_LED_PWM=y
# CONFIG_PWM_LOG_LEVEL_DBG=y

CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# Windows Battery Reporting Fix
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Enable experimental BLE features to improve stability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
